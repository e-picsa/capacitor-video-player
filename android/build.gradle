ext {
    junitVersion = project.hasProperty('junitVersion') ? rootProject.ext.junitVersion : '4.13.2'
    androidxAppCompatVersion = project.hasProperty('androidxAppCompatVersion') ? rootProject.ext.androidxAppCompatVersion : '1.7.1'
    androidxJunitVersion = project.hasProperty('androidxJunitVersion') ? rootProject.ext.androidxJunitVersion : '1.3.0'
    androidxEspressoCoreVersion = project.hasProperty('androidxEspressoCoreVersion') ? rootProject.ext.androidxEspressoCoreVersion : '3.7.0'
}

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
    }
}

apply plugin: 'com.android.library'

android {
    namespace = "com.jeep.plugin.capacitor.capacitorvideoplayer"
    compileSdk = project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36
    defaultConfig {
        minSdkVersion = project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 24
        targetSdkVersion = project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 36
        versionCode = 1
        versionName = "1.0"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        // Merged into consumer apps so R8 keeps our Class.forName targets
        // (CastHelper + adaptive media factories) in minified release builds.
        consumerProguardFiles 'consumer-rules.pro'
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    lintOptions {
        abortOnError = false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

repositories {
    google()
    mavenCentral()
}


dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':capacitor-android')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.2.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.gridlayout:gridlayout:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation 'androidx.media3:media3-exoplayer:1.9.1'
    implementation 'androidx.media3:media3-ui:1.9.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.9.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.9.1'
    implementation 'androidx.media3:media3-exoplayer-smoothstreaming:1.9.1'
    implementation 'androidx.media3:media3-session:1.9.1'
    // Optional Cast (Chromecast remote playback). ON by default.
    // Opt out in android/gradle.properties:
    //   capacitorVideoPlayerCast=false
    // (or root ext / -PcapacitorVideoPlayerCast=false).
    // Opt-out uses compileOnly + reflection, hiding the cast button safely.
    def wantCast = true
    try {
        def prop = project.findProperty('capacitorVideoPlayerCast')
        if (prop == null && rootProject.ext.has('capacitorVideoPlayerCast')) {
            prop = rootProject.ext.capacitorVideoPlayerCast
        }
        if (prop != null) {
            wantCast = prop.toString().toBoolean()
        }
    } catch (Exception ignored) {
        // keep default
    }
    if (wantCast) {
        implementation 'androidx.media3:media3-cast:1.9.1'
    } else {
        compileOnly 'androidx.media3:media3-cast:1.9.1'
        compileOnly 'com.google.android.gms:play-services-cast-framework:21.5.0'
    }
    // Kept as implementation: the layout still contains a MediaRouteButton (hidden when
    // chromecast:false or when cast libs are absent). Small footprint vs cast-framework.
    implementation 'androidx.mediarouter:mediarouter:1.8.0'
    implementation 'com.squareup.picasso:picasso:2.71828'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}
