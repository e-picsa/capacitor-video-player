name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
      - 'LICENSE'
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      api_level:
        description: 'Android API level for instrumented tests (default: 35)'
        required: false
        default: '35'
        type: string

permissions:
  contents: read
  actions: write

env:
  NODE_VERSION: '24.x'
  JAVA_VERSION: '21'
  # Default emulator API level for regular CI runs.
  # Set to API 35 for stable headless execution in GitHub Actions runners.
  # Update to 36 once stable Android 16 emulator system images are generally available.
  DEFAULT_EMULATOR_API_LEVEL: '35'

jobs:
  lint-and-web:
    name: Lint & Web Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint source code
        run: npm run lint

      - name: Build plugin package
        run: npm run build

      - name: 'Fail-fast: cancel workflow on failure'
        if: failure()
        run: gh run cancel ${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}

  android-build:
    name: Android Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install root dependencies & build plugin
        run: |
          npm ci
          npm run build

      - name: Install example-app dependencies & sync Android
        run: |
          cd example-app
          npm ci
          npm run build:android

      - name: Compile and Lint Android (example-app & plugin)
        run: |
          cd example-app/android
          ./gradlew :app:lintDebug :capacitor-video-player:lintDebug assembleDebug

      - name: 'Fail-fast: cancel workflow on failure'
        if: failure()
        run: gh run cancel ${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}

  android-instrumented-tests:
    name: Android Instrumented Tests (API ${{ inputs.api_level || '35' }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prepare plugin & example-app
        run: |
          npm ci
          npm run build
          cd example-app
          npm ci
          npm run build:android

      - name: Run instrumented tests on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api_level || env.DEFAULT_EMULATOR_API_LEVEL }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: cd example-app/android && ./gradlew :app:connectedAndroidTest

      - name: Upload instrumented test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumented-test-reports
          path: example-app/android/app/build/reports/androidTests/connected/

      - name: 'Fail-fast: cancel workflow on failure'
        if: failure()
        run: gh run cancel ${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}

