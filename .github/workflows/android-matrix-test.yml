name: Android Matrix Tests (On-Demand)

# -----------------------------------------------------------------------------
# On-demand pre-release qualification workflow.
#
# This workflow runs instrumented tests across a matrix of Android versions:
# - API 24: minSdk (Android 7.0 Nougat - baseline platform compatibility)
# - API 28: Android 9.0 Pie (transition point for legacy storage & background limits)
# - API 33: Android 13 (introduction of READ_MEDIA_VIDEO permission split)
# - API 34: Android 14 (strict foreground service types for media playback)
# - API 35: Android 15 (current stable platform baseline)
# - API 36: Android 16 / targetSdk 36 (predictive back navigation - placeholder)
# -----------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      test_scope:
        description: 'Test scope description or note for this run'
        required: false
        default: 'Pre-release matrix verification'
        type: string

env:
  NODE_VERSION: '24.x'
  JAVA_VERSION: '21'

jobs:
  matrix-test:
    name: Instrumented Tests (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [24, 28, 33, 34, 35]
        # Note: Add 36 once stable Android 16 Google APIs emulator system images
        # are generally available in GitHub Actions runners.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prepare plugin & example-app
        run: |
          npm ci
          npm run build
          cd example-app
          npm ci
          npm run build:android

      - name: Run instrumented tests on Android Emulator (API ${{ matrix.api-level }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: cd example-app/android && ./gradlew connectedAndroidTest

      - name: Upload test results (API ${{ matrix.api-level }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports-api-${{ matrix.api-level }}
          path: example-app/android/app/build/reports/androidTests/connected/
